<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mask Off</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange-primary: #ff6b35;
            --orange-secondary: #ff8c42;
            --orange-glow: rgba(255, 107, 53, 0.4);
            --bg-black: #000000;
            --bg-dark: #0a0a0a;
            --text-white: #ffffff;
            --text-gray: #888888;
            --border-subtle: rgba(255, 107, 53, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--orange-glow) 0%, transparent 70%);
            filter: blur(100px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.5; }
        }

        /* --- UI Elements --- */
        .logo {
            position: fixed;
            top: 40px;
            left: 40px;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--orange-primary), var(--orange-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 100;
            text-transform: uppercase;
        }

        .stats {
            position: fixed;
            top: 40px;
            right: 40px;
            display: flex;
            gap: 40px;
            z-index: 100;
        }

        .stat-box { text-align: right; }
        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-gray);
            font-weight: 600;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--orange-primary), var(--orange-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Game Container --- */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 100px;
            align-items: center;
            justify-content: center;
            padding: 40px;
            width: 100%;
        }

        .face-card {
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.8));
        }

        .face-card:hover {
            transform: translateY(-12px) scale(1.02);
            filter: drop-shadow(0 30px 80px rgba(255, 107, 53, 0.4));
        }

        /* BILDGRÖSSE HIER ANGEPASST (380px statt 480px) */
        .card-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            border-radius: 32px;
            overflow: hidden;
            background: linear-gradient(145deg, #0f0f0f, #000000);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .card-border {
            position: absolute;
            inset: 0;
            border-radius: 32px;
            padding: 2.5px;
            background: linear-gradient(135deg, var(--orange-primary), var(--orange-secondary), #ffd700, var(--orange-secondary), var(--orange-primary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.5;
            transition: opacity 0.4s ease;
            background-size: 200% 200%;
        }

        .face-card:hover .card-border {
            opacity: 1;
            animation: borderGlow 2s ease infinite, borderShift 3s ease infinite;
        }

        @keyframes borderGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes borderShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 30px;
        }

        .face-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .face-card:hover .face-image { transform: scale(1.08); }

        .streak-indicator {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 28px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 100px;
            border: 1px solid var(--border-subtle);
            z-index: 3;
        }

        .streak-number {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--orange-primary), var(--orange-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .vs-separator {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vs-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg-black);
            border: 2px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        /* --- RESPONSIVE MATCH SCREEN (UNVERÄNDERT) --- */
        .match-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 107, 53, 0.2) 0%, rgba(0, 0, 0, 0.98) 80%);
            backdrop-filter: blur(40px) saturate(150%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .match-profile-image {
            width: 80vw;
            height: 80vw;
            max-width: 350px;
            max-height: 350px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 6px solid transparent;
            background: linear-gradient(145deg, #0f0f0f, #000000) padding-box,
                        linear-gradient(135deg, var(--orange-primary), var(--orange-secondary), #ffd700) border-box;
            box-shadow: 0 30px 90px rgba(255, 107, 53, 0.5);
            animation: matchImagePop 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            flex-shrink: 0;
        }

        .match-icon {
            font-size: clamp(60px, 15vw, 120px);
            margin-bottom: 10px;
            animation: matchHeartBeat 1.5s ease infinite;
        }

        .match-text {
            font-size: clamp(40px, 12vw, 90px);
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff6b35, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .match-subtext {
            font-size: clamp(14px, 4vw, 20px);
            color: var(--text-gray);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .match-click-hint {
            margin-top: 30px;
            font-size: 14px;
            color: var(--orange-primary);
            font-weight: 700;
            animation: matchHintBounce 2s ease infinite;
        }

        /* --- Animations --- */
        @keyframes matchImagePop {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes matchHeartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes matchHintBounce {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-10px); opacity: 1; }
        }

        /* --- Animations for transitions --- */
        .selected { animation: selectFlash 0.6s ease; }
        @keyframes selectFlash { 50% { transform: scale(1.05); filter: brightness(1.5); } }

        .rejected-left { animation: slideOutLeft 0.6s ease forwards; }
        @keyframes slideOutLeft { to { opacity: 0; transform: translateX(-200px) rotate(-10deg); } }

        .rejected-right { animation: slideOutRight 0.6s ease forwards; }
        @keyframes slideOutRight { to { opacity: 0; transform: translateX(200px) rotate(10deg); } }

        /* --- Responsive Viewport Tweaks --- */
        @media (max-width: 1200px) {
            .card-wrapper { width: 320px; height: 320px; }
            .container { gap: 50px; }
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; gap: 30px; }
            .vs-separator { transform: rotate(90deg); height: 40px; }
            .card-wrapper { width: 280px; height: 280px; }
            .logo, .stats { top: 20px; }
        }

        @media (max-height: 750px) and (orientation: landscape) {
            .match-profile-image { max-width: 180px; max-height: 180px; }
            .match-icon { font-size: 40px; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    
    <div class="logo">Mask Off</div>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-label">Choices</div>
            <div class="stat-value" id="choices-stat">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Matches</div>
            <div class="stat-value" id="matches-stat">0</div>
        </div>
    </div>

    <div class="container">
        <div class="face-card" id="card-left" onclick="selectFace('left')">
            <div class="card-wrapper">
                <div class="card-border"></div>
                <div class="image-container">
                    <img class="face-image" id="img-left" src="" alt="Face">
                </div>
                <div class="streak-indicator">
                    <span class="streak-icon">🔥</span>
                    <span class="streak-number" id="streak-left">0</span>
                </div>
            </div>
        </div>

        <div class="vs-separator">
            <div class="vs-circle" id="vs-circle">
                <span style="color:var(--orange-primary)">VS</span>
            </div>
        </div>

        <div class="face-card" id="card-right" onclick="selectFace('right')">
            <div class="card-wrapper">
                <div class="card-border"></div>
                <div class="image-container">
                    <img class="face-image" id="img-right" src="" alt="Face">
                </div>
                <div class="streak-indicator">
                    <span class="streak-number" id="streak-right">0</span>
                    <span class="streak-icon">🔥</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let choices = 0;
        let matches = 0;
        let leftStreak = 0;
        let rightStreak = 0;
        let isAnimating = false;
        let imageCounter = 0;
        const API_URL = 'https://thispersondoesnotexist.com/';

        function loadFace(side, reset = true) {
            const img = document.getElementById(`img-${side}`);
            const card = document.getElementById(`card-${side}`);
            const streak = document.getElementById(`streak-${side}`);

            card.style.opacity = '0';
            if (reset) {
                if (side === 'left') leftStreak = 0;
                else rightStreak = 0;
                streak.textContent = '0';
            }

            imageCounter++;
            img.src = `${API_URL}?t=${Date.now()}_${imageCounter}`;
            img.onload = () => card.style.opacity = '1';
        }

        function showMatch(side) {
            const imgElement = document.getElementById(`img-${side}`);
            const imgSrc = imgElement.src;

            const screen = document.createElement('div');
            screen.className = 'match-screen';
            screen.innerHTML = `
                <img class="match-profile-image" src="${imgSrc}" alt="Match">
                <div class="match-icon">💕</div>
                <div class="match-text">Match!</div>
                <div class="match-subtext">Connection Found</div>
                <div class="match-click-hint">Tap to Continue →</div>
            `;
            
            document.body.appendChild(screen);

            screen.onclick = function() {
                screen.style.opacity = '0';
                screen.style.transition = 'opacity 0.4s ease';
                setTimeout(() => {
                    screen.remove();
                    resetGameAfterMatch();
                }, 400);
            };
        }

        function resetGameAfterMatch() {
            loadFace('left', true);
            setTimeout(() => {
                loadFace('right', true);
                isAnimating = false;
            }, 200);
        }

        function selectFace(side) {
            if (isAnimating) return;
            isAnimating = true;

            const selected = document.getElementById(`card-${side}`);
            const otherSide = side === 'left' ? 'right' : 'left';
            const rejected = document.getElementById(`card-${otherSide}`);

            choices++;
            document.getElementById('choices-stat').textContent = choices;

            if (side === 'left') {
                leftStreak++;
                document.getElementById('streak-left').textContent = leftStreak;
            } else {
                rightStreak++;
                document.getElementById('streak-right').textContent = rightStreak;
            }

            const currentStreak = side === 'left' ? leftStreak : rightStreak;

            if (currentStreak >= 5) {
                matches++;
                document.getElementById('matches-stat').textContent = matches;
                showMatch(side);
            } else {
                selected.classList.add('selected');
                rejected.classList.add(otherSide === 'left' ? 'rejected-left' : 'rejected-right');

                setTimeout(() => {
                    selected.classList.remove('selected');
                    rejected.classList.remove('rejected-left', 'rejected-right');
                    loadFace(otherSide, true);
                    isAnimating = false;
                }, 600);
            }
        }

        window.onload = () => {
            loadFace('left', true);
            setTimeout(() => loadFace('right', true), 200);
        };
    </script>
</body>
</html>
