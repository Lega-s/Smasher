<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wähle dein Gesicht</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--color-1) 0%, var(--color-2) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        :root {
            --color-1: #ff6b35;
            --color-2: #ff8c42;
        }

        .color-picker {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .color-picker h3 {
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #333;
        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .instruction {
            color: white;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.2em;
            opacity: 0.9;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
        }

        .image-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: visible;
        }

        .image-card:hover {
            transform: scale(1.02);
        }

        .image-card img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }

        @keyframes selectPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 40px var(--color-1);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            }
        }

        @keyframes slideOutLeft {
            0% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-150px);
            }
        }

        @keyframes slideOutRight {
            0% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(150px);
            }
        }

        @keyframes matchAnimation {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(-50%);
            }
            50% {
                opacity: 1;
                transform: scale(1.2) translateY(-50%);
            }
            100% {
                opacity: 0;
                transform: scale(1) translateY(-100%);
            }
        }

        .selected {
            animation: selectPulse 0.5s ease;
        }

        .rejected-left {
            animation: slideOutLeft 0.4s ease forwards;
        }

        .rejected-right {
            animation: slideOutRight 0.4s ease forwards;
        }

        .match-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ff6b35, #ffd700);
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 3em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: matchAnimation 2s ease;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.6);
        }

        .match-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(135deg, #ff6b35, #ffd700);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .score {
            color: white;
            font-size: 1.5em;
            margin-top: 30px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }

            .image-card img {
                width: 250px;
                height: 250px;
            }

            h1 {
                font-size: 1.8em;
            }

            .color-picker {
                top: 10px;
                right: 10px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="color-picker">
        <h3>🎨 Farbe wählen</h3>
        <div class="color-options">
            <button class="color-btn active" style="background: linear-gradient(135deg, #ff6b35, #ff8c42)" onclick="changeColor('#ff6b35', '#ff8c42')"></button>
            <button class="color-btn" style="background: linear-gradient(135deg, #667eea, #764ba2)" onclick="changeColor('#667eea', '#764ba2')"></button>
            <button class="color-btn" style="background: linear-gradient(135deg, #f093fb, #f5576c)" onclick="changeColor('#f093fb', '#f5576c')"></button>
            <button class="color-btn" style="background: linear-gradient(135deg, #4facfe, #00f2fe)" onclick="changeColor('#4facfe', '#00f2fe')"></button>
            <button class="color-btn" style="background: linear-gradient(135deg, #43e97b, #38f9d7)" onclick="changeColor('#43e97b', '#38f9d7')"></button>
            <button class="color-btn" style="background: linear-gradient(135deg, #fa709a, #fee140)" onclick="changeColor('#fa709a', '#fee140')"></button>
        </div>
    </div>

    <h1>🎭 Gesichter-Auswahl Spiel</h1>
    <p class="instruction">Klicke auf das Gesicht, das dir besser gefällt!</p>
    
    <div class="container" id="container">
        <div class="image-card" id="card-left" onclick="selectImage('left')">
            <img id="img-left" src="" alt="Gesicht Links">
            <div class="match-count" id="count-left">0</div>
        </div>
        
        <div class="image-card" id="card-right" onclick="selectImage('right')">
            <img id="img-right" src="" alt="Gesicht Rechts">
            <div class="match-count" id="count-right">0</div>
        </div>
    </div>

    <div class="score">
        <p>Ausgewählt: <span id="count">0</span> Gesichter | Matches: <span id="matches">0</span></p>
    </div>

    <script>
        let count = 0;
        let matches = 0;
        const API_URL = 'https://thispersondoesnotexist.com/';
        
        // Tracking für jedes Gesicht
        let leftImageCount = 0;
        let rightImageCount = 0;
        let isAnimating = false; // Verhindert mehrfache Klicks während Animation
        let imageCounter = 0; // Eindeutige IDs für Bilder

        // Funktion um Farbe zu ändern
        function changeColor(color1, color2) {
            document.documentElement.style.setProperty('--color-1', color1);
            document.documentElement.style.setProperty('--color-2', color2);
            
            // Update active button
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Funktion um ein zufälliges Bild zu laden
        function loadRandomImage(side, resetCount = true) {
            const img = document.getElementById(`img-${side}`);
            const card = document.getElementById(`card-${side}`);
            const countBadge = document.getElementById(`count-${side}`);
            
            // Setze erstmal Opacity auf 0 während des Ladens
            card.style.opacity = '0';
            
            // Reset count für diese Seite
            if (resetCount) {
                if (side === 'left') {
                    leftImageCount = 0;
                } else {
                    rightImageCount = 0;
                }
                countBadge.textContent = '0';
            }
            
            // Loading-Zustand
            card.classList.add('loading');
            
            // Eindeutige ID für jedes neue Bild
            imageCounter++;
            const newUrl = `${API_URL}?t=${Date.now()}_${imageCounter}_${Math.random()}`;
            
            img.src = newUrl;
            
            // Entferne Loading-Zustand wenn Bild geladen ist und fade in
            img.onload = function() {
                card.classList.remove('loading');
                card.style.opacity = '1';
            };
        }

        // Funktion um Match-Badge anzuzeigen
        function showMatch() {
            const container = document.getElementById('container');
            const matchBadge = document.createElement('div');
            matchBadge.className = 'match-badge';
            matchBadge.textContent = '💕 Match!';
            container.appendChild(matchBadge);
            
            setTimeout(() => {
                matchBadge.remove();
            }, 2000);
        }

        // Funktion wenn ein Bild ausgewählt wird
        function selectImage(side) {
            // Verhindere mehrfache Klicks während Animation
            if (isAnimating) return;
            
            isAnimating = true;
            
            const selectedCard = document.getElementById(`card-${side}`);
            const otherSide = side === 'left' ? 'right' : 'left';
            const rejectedCard = document.getElementById(`card-${otherSide}`);
            
            // Erhöhe Count für ausgewähltes Bild
            if (side === 'left') {
                leftImageCount++;
                document.getElementById('count-left').textContent = leftImageCount;
            } else {
                rightImageCount++;
                document.getElementById('count-right').textContent = rightImageCount;
            }
            
            // Erhöhe Counter
            count++;
            document.getElementById('count').textContent = count;
            
            // Check für Match (5x ausgewählt)
            const currentCount = side === 'left' ? leftImageCount : rightImageCount;
            
            if (currentCount >= 5) {
                // Match!
                matches++;
                document.getElementById('matches').textContent = matches;
                showMatch();
                
                // Animation für Match
                selectedCard.classList.add('selected');
                
                // Beide Bilder nach Animation ersetzen
                setTimeout(() => {
                    selectedCard.classList.remove('selected');
                    selectedCard.classList.add(side === 'left' ? 'rejected-left' : 'rejected-right');
                    rejectedCard.classList.add(otherSide === 'left' ? 'rejected-left' : 'rejected-right');
                    
                    setTimeout(() => {
                        selectedCard.classList.remove(side === 'left' ? 'rejected-left' : 'rejected-right');
                        rejectedCard.classList.remove(otherSide === 'left' ? 'rejected-left' : 'rejected-right');
                        
                        // Lade beide Bilder neu mit Delay zwischen ihnen
                        loadRandomImage('left', true);
                        setTimeout(() => {
                            loadRandomImage('right', true);
                            isAnimating = false;
                        }, 200);
                    }, 400);
                }, 500);
            } else {
                // Normale Auswahl
                // Animation für ausgewähltes Bild
                selectedCard.classList.add('selected');
                setTimeout(() => {
                    selectedCard.classList.remove('selected');
                }, 500);
                
                // Animation für abgelehntes Bild (mit richtiger Richtung)
                rejectedCard.classList.add(otherSide === 'left' ? 'rejected-left' : 'rejected-right');
                
                // Lade neues Bild für die ANDERE Seite nach Animation
                setTimeout(() => {
                    rejectedCard.classList.remove(otherSide === 'left' ? 'rejected-left' : 'rejected-right');
                    loadRandomImage(otherSide, true);
                    isAnimating = false;
                }, 400);
            }
        }

        // Initiales Laden beider Bilder
        window.onload = function() {
            loadRandomImage('left', true);
            setTimeout(() => loadRandomImage('right', true), 200);
        };
    </script>
</body>
</html>
